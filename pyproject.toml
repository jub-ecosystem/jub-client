[tool.poetry]
name = "jub"
version = "0.1.0a5"
description = ""
authors = ["Ignacio Castillo <jcastillo@mictlanx.com>"]
license = "GPL-3.0-or-later"
readme = "README.md"
packages = [{include = "jub"}]

[tool.poetry.dependencies]
python = ">=3.10,<4"
option = ">=2.1.0,<3"
pydantic = ">=2.6.4,<3"
httpx = ">=0.28.1,<1"
python-dotenv = ">=1.0.0,<2"
# Only used by the legacy v1 client (jub/client/v1)
requests = ">=2.31.0,<3"
nanoid = ">=2.0.0,<3"

[tool.poetry.group.dev.dependencies]
coverage = "^7.13.4"
pytest-asyncio = "^1.3.0"
pytest = "^9.0.3"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
zensical = "^0.0.24"
mkdocstrings-python = "^2.0.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.pytest.ini_options]
asyncio_mode = "auto"
